<head>

    <title>Payment for Ayessha Sarang</title>
    <style>
        :root {
            --primary: #6739b7;
            --primary-hover: #5a2e9f;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        h1 { margin-bottom: 1.5rem; font-weight: 700; }
        .input-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #666; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }
        button:hover { background-color: var(--primary-hover); }
        .status { margin-top: 1rem; font-size: 0.9rem; }
        .discount-note {
            color: #1f7a3a;
            display: none;
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="background: var(--primary); color: white; margin: -2rem -2rem 2rem -2rem; padding: 2rem; border-radius: 20px 20px 0 0;">
            <h2 style="margin: 0; font-size: 1.2rem; opacity: 0.9;">Payment for Ayessha Sarang</h2>
            <h1 id="price" style="margin: 0.5rem 0 0 0; font-size: 2.5rem;">₹8,000</h1>
        </div>
        
        <div style="text-align: left; margin-bottom: 2rem;">
            <h3 id="productTitle" style="margin: 0; color: var(--text);">Soul Healing Consultation</h3>
            <p id="productDescription" style="margin: 0.5rem 0; color: #666; font-size: 0.9rem; line-height: 1.4;">
                Complete your payment to schedule your session with Ayessha. Includes deep healing and personalized guidance.
            </p>
        </div>

        <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" autocomplete="name" required>
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
        </div>

        <div class="input-group">
            <label for="mobile">Phone Number</label>
            <input type="tel" id="mobile" placeholder="Enter 10 digit phone number" autocomplete="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="input-group">
            <label for="promoCode">Promo Code</label>
            <input type="text" id="promoCode" placeholder="Enter promo code if you have one" autocomplete="off">
            <div id="discountNote" class="discount-note">Promo applied. Consultation price reduced to ₹1.</div>
        </div>
        
        <input type="hidden" id="productId" value="consultation">
        
        <button id="payBtn">Pay ₹8,000 Now</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        const products = {
            consultation: {
                id: 'consultation',
                title: 'Soul Healing Consultation',
                amount: 8000,
                description: 'Complete your payment to schedule your session with Ayessha. Includes deep healing and personalized guidance.'
            },
            'relationship-guide': {
                id: 'relationship-guide',
                title: 'Relationship Guide',
                amount: 200,
                description: 'Complete your payment to receive the Relationship Guide by Ayessha Sarang.'
            },
            'alchemy-course': {
                id: 'alchemy-course',
                title: 'Alchemy Course',
                amount: 2000,
                description: 'Complete your payment to enroll in the Alchemy Course by Ayessha Sarang.'
            }
        };
        const promoCodes = {
            AYESSHA1: {
                productId: 'consultation',
                discountedAmount: 1
            }
        };

        const pathProductId = window.location.pathname.replace(/^\/|\/$/g, '');
        const currentProduct = products[pathProductId] || products.consultation;
        const promoInput = document.getElementById('promoCode');
        const discountNote = document.getElementById('discountNote');

        function formatAmount(amount) {
            return new Intl.NumberFormat('en-IN').format(amount);
        }

        function getAppliedPromo() {
            const code = promoInput.value.replace(/\s/g, '').toUpperCase();
            const promo = promoCodes[code];
            return promo && promo.productId === currentProduct.id ? { code, ...promo } : null;
        }

        function renderPrice() {
            const promo = getAppliedPromo();
            const amount = promo ? promo.discountedAmount : currentProduct.amount;
            const formattedAmount = formatAmount(amount);

            document.getElementById('price').innerText = `₹${formattedAmount}`;
            document.getElementById('payBtn').innerText = `Pay ₹${formattedAmount} Now`;
            discountNote.style.display = promo ? 'block' : 'none';
        }

        document.title = `${currentProduct.title} - Payment for Ayessha Sarang`;
        document.getElementById('productTitle').innerText = currentProduct.title;
        document.getElementById('productDescription').innerText = currentProduct.description;
        document.getElementById('productId').value = currentProduct.id;
        renderPrice();
        promoInput.addEventListener('input', renderPrice);

        document.getElementById('payBtn').addEventListener('click', async () => {
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const mobileInput = document.getElementById('mobile');
            const productId = document.getElementById('productId').value;
            const promoCode = promoInput.value.replace(/\s/g, '').toUpperCase();
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const mobile = mobileInput.value.replace(/\D/g, '');
            const status = document.getElementById('status');

            nameInput.value = name;
            mobileInput.value = mobile;

            if (!nameInput.checkValidity() || !emailInput.checkValidity() || !mobileInput.checkValidity()) {
                status.innerText = 'Please enter your full name, valid email, and 10 digit phone number.';
                nameInput.reportValidity();
                emailInput.reportValidity();
                mobileInput.reportValidity();
                return;
            }
            
            status.innerText = 'Initiating payment...';
            
            try {
                const response = await fetch('/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, promoCode, name, email, mobileNumber: mobile })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    console.log('Order Initiated:', data.orderId);
                    window.location.href = data.url;
                } else {
                    status.innerText = 'Error: ' + data.message;
                }
            } catch (err) {
                status.innerText = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
